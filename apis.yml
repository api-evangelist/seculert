name: Seculert
description: 'Seculert was an Israeli cybersecurity company that provided cloud-based automated threat
  and attack detection, analytics, and breach-detection services, correlating outbound traffic and threat
  intelligence to identify compromised devices. Backed by Norwest Venture Partners, it was acquired by
  Radware in January 2017 and folded into Radware''s cloud security portfolio; the independent seculert.com
  brand is now defunct. This enrichment pass found no live independent API surface: the apex domain no
  longer serves TLS, www.seculert.com redirects to a dead HubSpot landing page, and no /.well-known,
  llms.txt, or developer/API documentation is published. Retained as a network profile of an acquired,
  now-inactive provider; DNS records (DMARC ruf to dmarc@radware.com) corroborate the Radware ownership.'
